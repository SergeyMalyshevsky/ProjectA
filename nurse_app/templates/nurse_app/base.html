<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Услуги сиделки{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        header { background: #007bff; color: white; padding: 1rem; text-align: center; }
        nav { background: #0056b3; padding: 0.5rem; text-align: center; }
        nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; margin: 0 0.5rem; }
        nav a:hover { background: #003d80; border-radius: 4px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .alert { padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        footer { background: #333; color: white; text-align: center; padding: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>Услуги сиделки</h1>
        <p>Профессиональный уход за вашими близкими</p>
    </header>

    <nav>
        <a href="{% url 'nurse_app:home' %}">Главная</a>
        <a href="{% url 'nurse_app:nurse_list' %}">Сиделки</a>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2024 Услуги сиделки. Все права защищены.</p>
    </footer>
</body>
</html>
